# ==========================================
# Isolated Test Database Configuration (H2 In-Memory)
# Prevents maven test from polluting Supabase database
# ==========================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable SLA scanner during test runs
workflow.sla.timeout-scanner-cron=0 0 0 1 1 ? 2099
compliance.reminder.cron=0 0 0 1 1 ? 2099
