# ==========================================
# Server Configuration
# ==========================================
server.port=8081
server.servlet.context-path=/api

# ==========================================
# DataSource (MySQL) Configuration
# ==========================================
# Automatically creates the database if it doesn't exist
spring.datasource.url=jdbc:mysql://localhost:3306/subsidy_tracking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Maha@5900
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
# Schema generation strategy (use 'update' for development, 'validate' or 'none' for production)
spring.jpa.hibernate.ddl-auto=update
# Show SQL queries executed by Hibernate
spring.jpa.show-sql=true
# Format SQL queries in logs for better readability
spring.jpa.properties.hibernate.format_sql=true
# Disable Open Session in View pattern to optimize connection pool usage
spring.jpa.open-in-view=false

# ==========================================
# Spring Boot DevTools Configuration
# ==========================================
# Enable automatic restart when classpath files change
spring.devtools.restart.enabled=true
# Enable LiveReload server to trigger browser refresh
spring.devtools.livereload.enabled=true
# Exclude static assets from triggering restarts
spring.devtools.restart.exclude=static/**,public/**,templates/**

# ==========================================
# Springdoc OpenAPI (Swagger) Configuration
# ==========================================
# OpenAPI documentation JSON path
springdoc.api-docs.path=/v3/api-docs
# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html
# Sort HTTP methods alphabetically
springdoc.swagger-ui.operationsSorter=alpha
# Sort tags alphabetically
springdoc.swagger-ui.tagsSorter=alpha
# Controls default expansion setting for operations/tags (none, list, full)
springdoc.swagger-ui.doc-expansion=none
